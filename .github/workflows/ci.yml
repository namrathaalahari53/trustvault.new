name: TrustVault CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  security-and-integration-tests:
    name: Security, Persona Isolation & API Release Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24 (with built-in SQLite)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify Render Blueprint & Project Structure
        run: |
          test -f render.yaml
          test -f Dockerfile
          test -f database/schema.sql
          test -f THREATS.md
          test -f backend/TrustVault.Api/Program.cs
          test -f frontend/src/app/pages/login.component.ts

      - name: Run 16 Automated Zero-Trust Security & Persona Tests
        run: node scripts/run-security-tests.mjs
